<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings – Waliko Car Hire</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: #f0f4ff;
      color: #333;
      min-height: 100vh;
    }

    /* ── MAIN ── */
    main {
      max-width: 600px;
      margin: 24px auto;
      padding: 0 16px 40px;
    }

    /* ── PROFILE CARD ── */
    .profile-card {
      background: #fff;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 3px 16px rgba(20,100,221,0.09);
      border: 1px solid rgba(20,100,221,0.07);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .profile-pic-wrap {
      position: relative;
      flex-shrink: 0;
    }

    #profile-pic {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #1464dd;
      display: block;
    }

    .upload-label {
      position: absolute;
      bottom: 0; right: 0;
      background: #1464dd;
      color: #fff;
      width: 22px; height: 22px;
      border-radius: 50%;
      font-size: 0.75em;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 2px solid #fff;
    }

    #upload-input { display: none; }

    .profile-info h2 {
      font-size: 1em;
      font-weight: 700;
      color: #1a1a2e;
    }

    .profile-info p {
      font-size: 0.8em;
      color: #888;
      margin-top: 2px;
    }

    /* ── MENU CARD ── */
    .menu-card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 3px 16px rgba(20,100,221,0.09);
      border: 1px solid rgba(20,100,221,0.07);
      overflow: hidden;
      margin-bottom: 16px;
    }

    .menu-card .section-label {
      font-size: 0.72em;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #1464dd;
      padding: 12px 18px 6px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 18px;
      border-bottom: 1px solid #f0f4ff;
      text-decoration: none;
      color: #333;
      cursor: pointer;
      transition: background 0.15s;
      font-size: 0.88em;
      font-weight: 500;
    }

    .menu-item:last-child { border-bottom: none; }

    .menu-item:hover { background: #f5f8ff; }

    .menu-item .item-icon {
      font-size: 1.1em;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #f0f4ff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .menu-item .arrow {
      margin-left: auto;
      color: #ccc;
      font-size: 0.85em;
    }

    /* Emergency item */
    .menu-item.emergency {
      color: #c0392b;
    }

    .menu-item.emergency .item-icon {
      background: #fff0f0;
    }

    .menu-item.emergency:hover { background: #fff5f5; }

    /* Danger items */
    .menu-item.danger { color: #c0392b; }
    .menu-item.danger .item-icon { background: #fff0f0; }
    .menu-item.danger:hover { background: #fff5f5; }

    @media (max-width: 600px) {
      main { margin: 12px auto; }
      .profile-card { padding: 16px; }
    }
  </style>
</head>
<body>

  <main>

    <!-- Profile Card -->
    <div class="profile-card">
      <div class="profile-pic-wrap">
        <img id="profile-pic" src="default-profile.png" alt="Profile">
        <label class="upload-label" for="upload-input" title="Change photo">✏️</label>
        <input type="file" id="upload-input" accept="image/*">
      </div>
      <div class="profile-info">
        <h2 id="username-display">Waliko Car Hire</h2>
        <p>Tap ✏️ to update your photo</p>
      </div>
    </div>

    <!-- Account Menu -->
    <div class="menu-card">
      <div class="section-label">Account</div>
      <a class="menu-item" href="user.html">
        <span class="item-icon">👤</span> Personal Information <span class="arrow">›</span>
      </a>
      <a class="menu-item" href="credit.html">
        <span class="item-icon">💳</span> My Credit <span class="arrow">›</span>
      </a>
      <a class="menu-item" href="change-pass.html">
        <span class="item-icon">🔒</span> Change Password <span class="arrow">›</span>
      </a>
      <label class="menu-item" for="upload-input">
        <span class="item-icon">🖼️</span> Upload Profile Picture <span class="arrow">›</span>
      </label>
    </div>

    <div class="menu-card">
      <div class="section-label">Support</div>
      <a class="menu-item" href="faqs.html">
        <span class="item-icon">❓</span> Frequently Asked Questions <span class="arrow">›</span>
      </a>
      <a class="menu-item" href="call.html">
        <span class="item-icon">📞</span> Request a Call From Support <span class="arrow">›</span>
      </a>
      <a class="menu-item" href="camera.html">
        <span class="item-icon">📷</span> Record Car Condition Before Pickup <span class="arrow">›</span>
      </a>
      <a class="menu-item emergency" href="tel:+2547XXXXXXXXX">
        <span class="item-icon">🚨</span> Emergency <span class="arrow">›</span>
      </a>
    </div>

    <div class="menu-card">
      <div class="section-label">Danger Zone</div>
      <a class="menu-item danger" href="deactivate.html">
        <span class="item-icon">⏸️</span> Deactivate Account <span class="arrow">›</span>
      </a>
      <a class="menu-item danger" href="delete.html">
        <span class="item-icon">🗑️</span> Delete Account <span class="arrow">›</span>
      </a>
    </div>

  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const uploadInput = document.getElementById('upload-input');
      const profilePic = document.getElementById('profile-pic');
      const usernameDisplay = document.getElementById('username-display');

      // Load user info from localStorage
      const currentUser = localStorage.getItem('currentUser');
      if (currentUser) {
        const userObject = JSON.parse(currentUser);
        if (userObject.username) usernameDisplay.textContent = userObject.username;
        if (userObject.profilePicture) profilePic.src = userObject.profilePicture;
      }

      // Profile picture upload
      uploadInput.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (e) => {
            profilePic.src = e.target.result;
            if (currentUser) {
              const userObject = JSON.parse(currentUser);
              userObject.profilePicture = e.target.result;
              localStorage.setItem('currentUser', JSON.stringify(userObject));
            }
            localStorage.setItem('profilePicture', e.target.result);
          };
          reader.readAsDataURL(file);
        }
      });
    });
  </script>
<script src="user-header.js"></script>
<script src="maintenance-check.js"></script>
</body>
</html>
