<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payments – Waliko Car Hire</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Poppins',sans-serif;background:#f0f4ff;color:#333;}
    header{background:linear-gradient(135deg,#1464dd,#0d47a1);color:#fff;padding:10px 20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 3px 15px rgba(20,100,221,0.35);}
    header h1{font-size:1.2em;font-weight:700;}
    nav{display:flex;flex-wrap:wrap;gap:6px;}
    nav a{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);color:#fff;padding:7px 13px;border-radius:25px;font-size:0.78em;font-weight:500;text-decoration:none;transition:all 0.2s;}
    nav a:hover,nav a.active{background:rgba(255,255,255,0.3);border-color:rgba(255,255,255,0.6);}
    nav a.logout{border-color:rgba(255,100,100,0.4);color:#ffaaaa;}
    nav a.logout:hover{background:rgba(255,80,80,0.2);}
    main{max-width:900px;margin:24px auto;padding:0 16px 40px;}

    /* Summary bar */
    .summary-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
    .summary-card{flex:1;min-width:110px;background:#fff;border-radius:12px;padding:12px 16px;box-shadow:0 2px 10px rgba(20,100,221,0.08);border:1px solid rgba(20,100,221,0.07);text-align:center;}
    .summary-card .s-num{font-size:1.6em;font-weight:700;color:#1464dd;line-height:1;}
    .summary-card .s-label{font-size:0.72em;color:#888;margin-top:3px;}
    .summary-card.s-pending .s-num{color:#b35c00;}
    .summary-card.s-full .s-num{color:#27ae60;}
    .summary-card.s-amount .s-num{font-size:1.2em;color:#1464dd;}

    /* Controls */
    .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;}
    .page-title{font-size:1.2em;font-weight:700;color:#1464dd;}
    .search-wrap{position:relative;flex:1;min-width:180px;max-width:280px;}
    .search-wrap input{width:100%;padding:8px 12px 8px 34px;border:1.5px solid #dde3f0;border-radius:25px;font-family:'Poppins',sans-serif;font-size:0.82em;outline:none;transition:border-color 0.2s;background:#fff;}
    .search-wrap input:focus{border-color:#1464dd;}
    .search-wrap .s-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:0.9em;color:#aaa;pointer-events:none;}
    .filter-btns{display:flex;gap:6px;flex-wrap:wrap;}
    .f-btn{padding:6px 14px;border:1.5px solid #dde3f0;border-radius:25px;font-family:'Poppins',sans-serif;font-size:0.75em;font-weight:600;background:#fff;color:#666;cursor:pointer;transition:all 0.2s;}
    .f-btn.active{background:#1464dd;color:#fff;border-color:#1464dd;}

    .empty-card{background:#fff;border-radius:14px;padding:28px 24px;box-shadow:0 3px 16px rgba(20,100,221,0.09);border:1px solid rgba(20,100,221,0.07);margin-bottom:16px;}
    .alert-box{background:#fff5e6;border:1px solid #ffc87a;border-radius:10px;padding:14px 16px;font-size:0.88em;color:#b35c00;line-height:1.7;margin-bottom:16px;}
    .pending-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f4ff;flex-wrap:wrap;gap:8px;}
    .pending-row:last-child{border-bottom:none;}

    .payment-card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 3px 16px rgba(20,100,221,0.09);border:1px solid rgba(20,100,221,0.07);animation:fadeIn 0.3s ease;}
    .payment-card.fully-paid-card{border:2px solid #27ae60;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
    .p-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
    .p-header h3{font-size:1em;font-weight:700;color:#1a1a2e;}
    .p-id{font-size:0.75em;color:#888;margin-top:2px;}
    .status-badge{padding:5px 14px;border-radius:20px;font-size:0.75em;font-weight:700;}
    .status-paid{background:#e6f9ee;color:#1e8449;border:1px solid #a8ddb9;}
    .status-full{background:#27ae60;color:#fff;border:1px solid #219150;}
    .info-table{width:100%;border-collapse:collapse;margin-bottom:14px;}
    .info-table tr{border-bottom:1px solid #f0f4ff;}
    .info-table tr:last-child{border-bottom:none;}
    .info-table th{text-align:left;font-size:0.78em;font-weight:600;color:#888;padding:6px 8px 6px 0;width:150px;}
    .info-table td{font-size:0.85em;color:#333;padding:6px 8px 6px 0;}
    .card-footer{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
    .btn{padding:8px 16px;border:none;border-radius:8px;font-family:'Poppins',sans-serif;font-size:0.8em;font-weight:600;cursor:pointer;transition:all 0.2s;}
    .btn-blue{background:#1464dd;color:#fff;}
    .btn-blue:hover{background:#0d47a1;}
    .btn-green{background:#1a7040;color:#fff;}
    .btn-green:hover{background:#145530;}
    .btn-light{background:#f0f4ff;color:#1464dd;border:1px solid #c5d5f5;}
    .btn-light:hover{background:#e0eaff;}
    .no-results{text-align:center;padding:40px 24px;color:#aaa;font-size:0.92em;}

    /* Modal */
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);z-index:500;justify-content:center;align-items:center;padding:16px;}
    .modal.open{display:flex;}
    .modal-box{background:#fff;border-radius:16px;padding:28px 24px;width:100%;max-width:430px;position:relative;z-index:600;box-shadow:0 20px 50px rgba(0,0,0,0.25);animation:slideUp 0.25s ease;}
    @keyframes slideUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
    .modal-box h2{font-size:1.1em;font-weight:700;color:#0d3b8c;margin-bottom:16px;}
    .modal-close{position:absolute;top:14px;right:16px;background:#f0f4ff;border:none;width:28px;height:28px;border-radius:50%;font-size:1em;cursor:pointer;color:#555;display:flex;align-items:center;justify-content:center;}
    .modal-close:hover{background:#dde3f0;}
    .receipt-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f0f4ff;font-size:0.85em;}
    .receipt-row:last-child{border-bottom:none;}
    .receipt-row .label{color:#888;}
    .receipt-row .value{font-weight:600;color:#1a1a2e;}
    .modal-actions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end;}

    @media(max-width:600px){
      header{flex-direction:column;align-items:flex-start;gap:8px;}
      nav a{font-size:0.72em;padding:6px 10px;}
      .info-table th{width:110px;font-size:0.73em;}
      .summary-bar{gap:8px;}
      .summary-card{min-width:80px;padding:10px;}
      .controls{gap:8px;}
      .search-wrap{max-width:100%;}
    }
  </style>
</head>
<body>
  <header>
    <h1>&#x1F697; Waliko Car Hire</h1>
    <nav>
      <a href="dashboard.html">How to Use</a>
      <a href="car-available.html">Cars</a>
      <a href="bookings.html">My Bookings</a>
      <a href="payments.html" class="active">Payments</a>
      <a href="help.html">Help</a>
      <a href="account.html">Settings</a>
      <a href="feedback.html">Feedback</a>
      <a href="index.html" class="logout" id="logoutBtn">Logout</a>
    </nav>
  </header>

  <main>
    <!-- Summary -->
    <div class="summary-bar" id="summaryBar"></div>

    <!-- Controls -->
    <div class="controls">
      <div class="page-title">Payment History</div>
      <div class="search-wrap">
        <span class="s-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search car or booking ID…" oninput="renderPayments()">
      </div>
      <div class="filter-btns">
        <button class="f-btn active" data-f="all"     onclick="setFilter(this)">All</button>
        <button class="f-btn"        data-f="deposit" onclick="setFilter(this)">Deposit Paid</button>
        <button class="f-btn"        data-f="full"    onclick="setFilter(this)">Fully Paid</button>
      </div>
    </div>

    <div id="paymentsList"></div>
  </main>

  <div class="modal" id="receiptModal">
    <div class="modal-box">
      <button class="modal-close" id="closeReceipt">&#10005;</button>
      <h2>&#x1F9FE; Payment Receipt</h2>
      <div id="receiptContent"></div>
      <div class="modal-actions">
        <button class="btn btn-light" id="printBtn">&#x1F5A8; Print</button>
        <button class="btn btn-green" id="downloadBtn">&#x2B07; Download PDF</button>
      </div>
    </div>
  </div>

  <script>
  (function(){
    var currentBooking = null;
    var activeFilter   = 'all';

    function setFilter(btn){
      document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.f;
      renderPayments();
    }
    window.setFilter = setFilter;

    function isPaid(b){ return b.paymentStatus==='paid'||(b.mpesaReceipt&&b.mpesaReceipt!=='N/A'); }
    function getBalanceStatus(id){ try{ return JSON.parse(localStorage.getItem('balancePaid_'+id)||'null'); }catch(e){ return null; } }
    function calcAmounts(b){
      var days=Math.max(1,Math.ceil((new Date(b.endDate)-new Date(b.pickup))/86400000));
      var total=b.price*days, deposit=Math.floor(total/2), balance=total-deposit;
      return {days,total,deposit,balance};
    }

    function renderSummary(allBookings){
      var paid     = allBookings.filter(isPaid);
      var pending  = allBookings.filter(b => !isPaid(b));
      var fullPaid = paid.filter(b => { var bo=getBalanceStatus(b.bookingId); return !!(bo&&bo.paid)||!!b.balancePaid; });

      document.getElementById('summaryBar').innerHTML =
        `<div class="summary-card"><div class="s-num">${paid.length}</div><div class="s-label">Paid Bookings</div></div>`+
        `<div class="summary-card s-pending"><div class="s-num">${pending.length}</div><div class="s-label">Pending</div></div>`+
        `<div class="summary-card s-full"><div class="s-num">${fullPaid.length}</div><div class="s-label">Fully Paid</div></div>`;
    }

    function renderPayments(){
      var list = document.getElementById('paymentsList');
      list.innerHTML = '';
      var bookings = JSON.parse(localStorage.getItem('bookings')||'[]');
      bookings.forEach(b => { if(b.mpesaReceipt&&b.mpesaReceipt!=='N/A') b.paymentStatus='paid'; });

      renderSummary(bookings);

      var paid    = bookings.filter(isPaid);
      var pending = bookings.filter(b => !isPaid(b));
      var query   = (document.getElementById('searchInput').value||'').toLowerCase();

      // Apply filter
      var filtered = paid.filter(b => {
        var bo = getBalanceStatus(b.bookingId);
        var fp = !!(bo&&bo.paid)||!!b.balancePaid;
        if (activeFilter === 'deposit' && fp)  return false;
        if (activeFilter === 'full'    && !fp) return false;
        if (query && !b.carName.toLowerCase().includes(query) && !String(b.bookingId).toLowerCase().includes(query)) return false;
        return true;
      });

      if(paid.length === 0 && pending.length === 0){
        list.innerHTML='<div class="empty-card"><div class="alert-box">💳 No payments yet. <a href="car-available.html" style="color:#1464dd;font-weight:600;">Browse cars</a> to get started.</div></div>';
        return;
      }

      if(filtered.length === 0 && query){
        list.innerHTML='<div class="no-results">No payments match your search.</div>';
      }

      // Paid cards
      filtered.forEach(b => {
        var a   = calcAmounts(b);
        var bo  = getBalanceStatus(b.bookingId);
        var fp  = !!(bo&&bo.paid)||!!b.balancePaid;
        var balReceipt = (bo&&bo.receipt)||b.balanceReceipt||'';
        var balPaidAt  = (bo&&bo.paidAt)||b.balancePaidAt||'';

        var balanceDueHtml = fp
          ? `<tr><th>Balance Paid</th><td style="font-weight:700;color:#27ae60;">Ksh ${a.balance.toLocaleString()} ✅</td></tr>
             <tr><th>Balance Ref</th><td style="font-weight:700;color:#27ae60;">${balReceipt}</td></tr>
             <tr><th>Balance Paid On</th><td style="color:#555;">${balPaidAt}</td></tr>
             <tr><th>Outstanding</th><td style="font-weight:700;color:#27ae60;">Ksh 0.00 ✅</td></tr>`
          : `<tr><th>Balance Due</th><td style="color:#e05c2a;font-weight:700;">Ksh ${a.balance.toLocaleString()} <span style="font-size:0.8em;font-weight:400;color:#888;">(on pickup)</span></td></tr>`;

        var statusBadge = fp
          ? '<span class="status-badge status-full">✅ Fully Paid</span>'
          : '<span class="status-badge status-paid">💰 Deposit Paid</span>';

        var card = document.createElement('div');
        card.className = 'payment-card'+(fp?' fully-paid-card':'');
        card.innerHTML =
          `<div class="p-header">
            <div><h3>${b.carName}</h3>
            <div class="p-id">Booking: ${b.bookingId} &nbsp;·&nbsp; Paid: ${b.paidAt||'N/A'}</div></div>
            ${statusBadge}
          </div>
          <table class="info-table">
            <tr><th>Full Name</th><td>${b.fullName}</td></tr>
            <tr><th>Deposit Ref</th><td style="font-weight:700;color:#27ae60;">${b.mpesaReceipt||'N/A'}</td></tr>
            <tr><th>Deposit Paid</th><td style="font-weight:700;color:#27ae60;">Ksh ${a.deposit.toLocaleString()}</td></tr>
            ${balanceDueHtml}
            <tr><th>Start Date</th><td>${b.pickup}</td></tr>
            <tr><th>End Date</th><td>${b.endDate}</td></tr>
            <tr><th>Days</th><td>${a.days} day${a.days!==1?'s':''}</td></tr>
            <tr><th>Total Fee</th><td style="font-weight:700;color:#1a1a2e;">Ksh ${a.total.toLocaleString()}</td></tr>
          </table>
          <div class="card-footer">
            <button class="btn btn-light print-card-btn" data-id="${b.bookingId}">🖨️ Print</button>
            <button class="btn btn-blue receipt-btn" data-id="${b.bookingId}">🧾 Receipt</button>
          </div>`;
        list.appendChild(card);
      });

      // Pending section
      if(pending.length > 0){
        var wrap = document.createElement('div');
        wrap.className = 'empty-card';
        wrap.innerHTML = `<div class="alert-box">💳 You have <strong>${pending.length}</strong> booking(s) awaiting deposit payment.</div>`;
        pending.forEach(b => {
          var a = calcAmounts(b);
          var row = document.createElement('div');
          row.className = 'pending-row';
          row.innerHTML =
            `<div>
              <div style="font-size:0.88em;font-weight:600;color:#1a1a2e;">${b.carName}</div>
              <div style="font-size:0.75em;color:#888;">${b.bookingId}</div>
            </div>
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
              <span style="font-size:0.82em;color:#b35c00;font-weight:600;">Deposit: Ksh ${a.deposit.toLocaleString()}</span>
              <button class="btn btn-blue" style="font-size:0.75em;padding:6px 12px;"
                onclick="localStorage.setItem('paymentAmount','${a.deposit}');localStorage.setItem('paymentBookingId','${b.bookingId}');window.location.href='payment-gateway.html'">Pay Now</button>
            </div>`;
          wrap.appendChild(row);
        });
        list.appendChild(wrap);
      }

      // Bind buttons
      list.querySelectorAll('.receipt-btn').forEach(btn => {
        btn.addEventListener('click', () => openModal(btn.dataset.id));
      });
      list.querySelectorAll('.print-card-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          var bks = JSON.parse(localStorage.getItem('bookings')||'[]');
          var b = bks.find(x => String(x.bookingId)===String(btn.dataset.id));
          if(!b){ alert('Booking not found.'); return; }
          try{
            var url = URL.createObjectURL(buildPDF(b).output('blob'));
            var win = window.open(url,'_blank');
            if(win) win.onload = () => { win.focus(); win.print(); };
            else alert('Please allow popups to use Print.');
          }catch(e){ alert('Print error: '+e.message); }
        });
      });
    }

    /* MODAL */
    function openModal(bookingId){
      var bks = JSON.parse(localStorage.getItem('bookings')||'[]');
      var b = bks.find(x => String(x.bookingId)===String(bookingId));
      if(!b){ alert('Receipt not found.'); return; }
      currentBooking = b;
      var a  = calcAmounts(b);
      var bo = getBalanceStatus(b.bookingId);
      var fp = !!(bo&&bo.paid)||!!b.balancePaid;
      var balReceipt = (bo&&bo.receipt)||b.balanceReceipt||'N/A';
      var balPaidAt  = (bo&&bo.paidAt)||b.balancePaidAt||'N/A';

      var html =
        `<div class="receipt-row"><span class="label">Car</span><span class="value">${b.carName}</span></div>
         <div class="receipt-row"><span class="label">Booking ID</span><span class="value">${b.bookingId}</span></div>
         <div class="receipt-row"><span class="label">Full Name</span><span class="value">${b.fullName}</span></div>
         <div class="receipt-row"><span class="label">Deposit M-Pesa Ref</span><span class="value" style="color:#1a7040;">${b.mpesaReceipt||'N/A'}</span></div>
         <div class="receipt-row"><span class="label">Deposit Paid On</span><span class="value">${b.paidAt||'N/A'}</span></div>`;
      if(fp){
        html +=
          `<div class="receipt-row"><span class="label">Balance M-Pesa Ref</span><span class="value" style="color:#1a7040;">${balReceipt}</span></div>
           <div class="receipt-row"><span class="label">Balance Paid On</span><span class="value">${balPaidAt}</span></div>`;
      }
      html +=
        `<div class="receipt-row"><span class="label">Start Date</span><span class="value">${b.pickup}</span></div>
         <div class="receipt-row"><span class="label">End Date</span><span class="value">${b.endDate}</span></div>
         <div class="receipt-row"><span class="label">Deposit Paid</span><span class="value" style="color:#0d3b8c;">Ksh ${a.deposit.toLocaleString()}</span></div>`;
      if(fp){
        html +=
          `<div class="receipt-row"><span class="label">Balance Paid</span><span class="value" style="color:#1a7040;">Ksh ${a.balance.toLocaleString()}</span></div>
           <div class="receipt-row"><span class="label">Total Paid</span><span class="value" style="color:#1a7040;font-size:1.05em;">Ksh ${a.total.toLocaleString()}</span></div>
           <div class="receipt-row"><span class="label">Outstanding</span><span class="value" style="color:#27ae60;">Ksh 0.00 ✅</span></div>`;
      } else {
        html += `<div class="receipt-row"><span class="label">Balance on Pickup</span><span class="value" style="color:#e05c2a;">Ksh ${a.balance.toLocaleString()}</span></div>`;
      }

      document.getElementById('receiptContent').innerHTML = html;
      document.getElementById('receiptModal').classList.add('open');
    }

    /* STAMP */
    function drawStamp(doc,cx,cy){var R=14,NR=13,NG=59,NB=140,GR=244,GG=196,GB=48;doc.setDrawColor(NR,NG,NB);doc.setLineWidth(1.2);doc.circle(cx,cy,R,'D');doc.setLineWidth(0.5);doc.circle(cx,cy,R-2.5,'D');var sCY=cy-4.5,r1=3.2,r2=1.3,pts=[];for(var i=0;i<10;i++){var ang=(i*36-90)*Math.PI/180,rr=i%2===0?r1:r2;pts.push([cx+rr*Math.cos(ang),sCY+rr*Math.sin(ang)]);}doc.setFillColor(GR,GG,GB);for(var i=0;i<10;i++){var a=pts[i],b2=pts[(i+1)%10];doc.triangle(cx,sCY,a[0],a[1],b2[0],b2[1],'F');}doc.setDrawColor(200,152,10);doc.setLineWidth(0.2);for(var i=0;i<10;i++){var a=pts[i],b2=pts[(i+1)%10];doc.line(a[0],a[1],b2[0],b2[1]);}var tTxt='WALIKO CAR HIRE LTD',tR=R-3.5,tSpan=170*Math.PI/180;var tStart=-Math.PI/2-tSpan/2,tStep=tSpan/(tTxt.length-1);doc.setTextColor(NR,NG,NB);doc.setFont('helvetica','bold');doc.setFontSize(3.8);for(var i=0;i<tTxt.length;i++){var a=tStart+i*tStep;doc.text(tTxt[i],cx+tR*Math.cos(a),cy+tR*Math.sin(a),{angle:-(a*180/Math.PI+90),align:'center'});}var bTxt='NAIROBI \u00B7 KENYA',bR=R-3.5,bSpan=115*Math.PI/180;var bStart=Math.PI/2-bSpan/2,bStep=bSpan/(bTxt.length-1);doc.setFontSize(3.8);for(var i=0;i<bTxt.length;i++){var a=bStart+i*bStep;doc.text(bTxt[i],cx+bR*Math.cos(a),cy+bR*Math.sin(a),{angle:-(a*180/Math.PI-90),align:'center'});}doc.setFont('helvetica','bold');doc.setFontSize(4.8);doc.setTextColor(NR,NG,NB);doc.text('VERIFIED',cx,cy+2,{align:'center'});doc.setFontSize(4.5);doc.text('& PAID',cx,cy+6.5,{align:'center'});doc.setFontSize(3.5);doc.setTextColor(140,150,175);doc.text('EST. 2020',cx,cy+10.5,{align:'center'});}

    /* SIGNATURE */
    function drawSignatureA(doc,ox,oy){var sc=0.52,NR=13,NG=59,NB=140;function p(px,py){return [ox+px*sc,oy+py*sc];}doc.setDrawColor(NR,NG,NB);doc.setLineWidth(1.1);var W=[[4,10],[10,34],[16,18],[22,34],[28,10]];for(var i=0;i<W.length-1;i++){var a=p(W[i][0],W[i][1]),b=p(W[i+1][0],W[i+1][1]);doc.line(a[0],a[1],b[0],b[1]);}doc.setLineWidth(0.85);var s0=p(28,10);doc.lines([[sc*(32-28),sc*(22-10),sc*(36-28),sc*(28-10),sc*(40-28),sc*(26-10)],[sc*(43-40),sc*(24-26),sc*(43-40),sc*(19-26),sc*(41-40),sc*(17-26)],[sc*(39-41),sc*(15-17),sc*(37-41),sc*(18-17),sc*(38-41),sc*(21-17)],[sc*(39-38),sc*(24-21),sc*(42-38),sc*(26-21),sc*(45-38),sc*(23-21)]],s0[0],s0[1]);var lA=p(47,13),lB=p(47,30);doc.line(lA[0],lA[1],lB[0],lB[1]);doc.setFillColor(NR,NG,NB);var dp=p(47,10);doc.circle(dp[0],dp[1],0.7,'F');var o0=p(50,19);doc.lines([[sc*(51-50),sc*(13-19),sc*(56-50),sc*(12-19),sc*(59-50),sc*(16-19)],[sc*(61-59),sc*(19-16),sc*(59-59),sc*(25-16),sc*(55-59),sc*(26-16)],[sc*(52-55),sc*(27-26),sc*(50-55),sc*(24-26),sc*(52-55),sc*(21-26)],[sc*(54-52),sc*(18-21),sc*(58-52),sc*(17-21),sc*(61-52),sc*(20-21)],[sc*(63-61),sc*(23-20),sc*(62-61),sc*(28-20),sc*(59-61),sc*(30-20)]],o0[0],o0[1]);doc.setLineWidth(0.5);var tail=[[59,30],[72,25],[92,23],[112,27],[126,30],[138,27],[145,24]];for(var i=0;i<tail.length-1;i++){var ta=p(tail[i][0],tail[i][1]),tb=p(tail[i+1][0],tail[i+1][1]);doc.line(ta[0],ta[1],tb[0],tb[1]);}doc.setLineWidth(0.35);var ul1=p(3,39),ul2=p(100,39);doc.line(ul1[0],ul1[1],ul2[0],ul2[1]);doc.setTextColor(NR,NG,NB);doc.setFont('helvetica','bold');doc.setFontSize(10);var np=p(3,47);doc.text('Waliko Car Hire Ltd.',np[0],np[1]);doc.setTextColor(140,150,170);doc.setFont('helvetica','normal');doc.setFontSize(8.5);var tp=p(3,55);doc.text('Authorised Signatory',tp[0],tp[1]);}

    /* PDF */
    function buildPDF(b){
      var jsPDF=window.jspdf.jsPDF;
      var doc=new jsPDF({unit:'mm',format:'a4'});
      var PW=210,PH=297,L=14,RR=196,CW=182,NR=13,NG=59,NB=140;
      var a=calcAmounts(b);
      var bo=getBalanceStatus(b.bookingId);
      var fp=!!(bo&&bo.paid)||!!b.balancePaid;
      var balReceipt=(bo&&bo.receipt)||b.balanceReceipt||'N/A';
      var balPaidAt=(bo&&bo.paidAt)||b.balancePaidAt||'N/A';
      var issued=new Date().toLocaleDateString('en-KE',{day:'2-digit',month:'long',year:'numeric'});
      doc.setFillColor(NR,NG,NB);doc.rect(0,0,PW,46,'F');
      doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(22);doc.text('WALIKO CAR HIRE',L,20);
      doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(180,210,255);doc.text('Premium Vehicle Rentals  \u00B7  Nairobi, Kenya',L,29);
      doc.setTextColor(140,175,240);doc.setFontSize(8);doc.text('Receipt No: RCP-'+b.bookingId+'   \u00B7   Date: '+issued,L,39);
      doc.setFillColor(255,255,255);doc.roundedRect(PW-46,8,32,12,2,2,'F');
      doc.setTextColor(NR,NG,NB);doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.text('RECEIPT',PW-30,15.5,{align:'center'});
      doc.setFillColor(244,196,48);doc.rect(0,46,PW,4,'F');
      doc.setFillColor(240,245,255);doc.rect(0,50,PW,16,'F');
      doc.setTextColor(100,120,165);doc.setFont('helvetica','normal');doc.setFontSize(8);
      doc.text(fp?'Payment verified via M-Pesa  \u00B7  All payments cleared  \u00B7  Ready for pickup':'Payment verified via M-Pesa  \u00B7  Deposit = 50% of total hire cost',L,60);
      if(fp){doc.setFillColor(39,174,96);doc.roundedRect(PW-52,53,38,10,2,2,'F');doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(8);doc.text('FULLY PAID',PW-33,59.5,{align:'center'});}
      else{doc.setFillColor(230,249,238);doc.roundedRect(PW-38,53,24,10,2,2,'F');doc.setTextColor(26,112,64);doc.setFont('helvetica','bold');doc.setFontSize(8);doc.text('\u2714  PAID',PW-26,59.5,{align:'center'});}
      function secHead(label,y){doc.setFillColor(NR,NG,NB);doc.rect(L,y,3,13,'F');doc.setTextColor(NR,NG,NB);doc.setFont('helvetica','bold');doc.setFontSize(11);doc.text(label,L+6,y+9);}
      function tRow(label,value,y,shade,highlight,greenVal,RH){var RH=RH||11;if(highlight){doc.setFillColor(230,243,255);doc.rect(L,y-2,CW,RH,'F');doc.setDrawColor(180,210,240);doc.setLineWidth(0.3);doc.rect(L,y-2,CW,RH,'D');}else if(shade){doc.setFillColor(247,250,255);doc.rect(L,y-2,CW,RH,'F');}doc.setTextColor(140,150,170);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.text(label,L+4,y+RH*0.55);if(greenVal)doc.setTextColor(26,112,64);else if(highlight)doc.setTextColor(NR,NG,NB);else doc.setTextColor(26,26,46);doc.setFont('helvetica','bold');doc.setFontSize(highlight?9.5:8);doc.text(String(value),RR,y+RH*0.55,{align:'right'});}
      var RH=9,y=78;
      secHead('Customer & Booking Details',y);y+=14;
      [['Full Name',b.fullName],['Vehicle Hired',b.carName],['Booking ID',b.bookingId],['Pickup Date',b.pickup],['Return Date',b.endDate],['Duration',a.days+' day'+(a.days!==1?'s':'')]].forEach((r,i)=>{tRow(r[0],r[1],y,i%2===0,false,false,RH);y+=RH;});
      y+=6;secHead('Payment Summary',y);y+=14;
      tRow('Deposit M-Pesa Ref',b.mpesaReceipt||'N/A',y,true,false,true,RH);y+=RH;
      tRow('Deposit Paid On',b.paidAt||'N/A',y,false,false,false,RH);y+=RH;
      if(fp){tRow('Balance M-Pesa Ref',balReceipt,y,true,false,true,RH);y+=RH;tRow('Balance Paid On',balPaidAt,y,false,false,false,RH);y+=RH;}
      tRow('Total Rental Cost','Ksh '+a.total.toLocaleString(),y,true,false,false,RH);y+=RH;
      tRow('Deposit Paid (50%)','Ksh '+a.deposit.toLocaleString(),y,false,true,false,RH);y+=RH;
      if(fp){tRow('Balance Paid','Ksh '+a.balance.toLocaleString(),y,true,false,true,RH);y+=RH;tRow('Outstanding Balance','Ksh 0.00',y,false,false,true,RH);y+=RH;}
      else{tRow('Balance on Pickup','Ksh '+a.balance.toLocaleString(),y,true,false,false,RH);y+=RH;}
      var sigY=Math.max(y+6,PH-16-62);
      doc.setDrawColor(210,218,235);doc.setLineWidth(0.3);doc.line(L,sigY-4,PW-L,sigY-4);
      doc.setFillColor(248,250,255);doc.rect(0,sigY-6,PW,PH-16-(sigY-6),'F');
      doc.setTextColor(140,150,170);doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.text('Authorised by',L,sigY);
      drawSignatureA(doc,L,sigY+2);drawStamp(doc,PW-30,sigY+14);
      doc.setFillColor(NR,NG,NB);doc.rect(0,PH-16,PW,16,'F');
      doc.setTextColor(255,255,255);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.text('waliko.co.ke  \u00B7  info@waliko.co.ke  \u00B7  +254 700 000 000',PW/2,PH-8.5,{align:'center'});
      doc.setFontSize(6.5);doc.setTextColor(160,195,255);doc.text('This is an official computer-generated receipt and is valid without a physical stamp.',PW/2,PH-3,{align:'center'});
      return doc;
    }

    document.getElementById('downloadBtn').onclick=function(){ if(!currentBooking){alert('No booking selected.');return;} try{buildPDF(currentBooking).save('Waliko-Receipt-'+currentBooking.bookingId+'.pdf');}catch(e){alert('PDF error: '+e.message);} };
    document.getElementById('printBtn').onclick=function(){ if(!currentBooking){alert('No booking selected.');return;} try{var url=URL.createObjectURL(buildPDF(currentBooking).output('blob'));var win=window.open(url,'_blank');if(win)win.onload=function(){win.focus();win.print();};else alert('Please allow popups.');}catch(e){alert('Print error: '+e.message);} };
    document.getElementById('closeReceipt').onclick=function(){ document.getElementById('receiptModal').classList.remove('open'); currentBooking=null; };
    document.getElementById('receiptModal').addEventListener('click',function(e){ if(e.target===document.getElementById('receiptModal')){ document.getElementById('receiptModal').classList.remove('open'); currentBooking=null; } });
    document.getElementById('logoutBtn').addEventListener('click',function(e){ e.preventDefault(); localStorage.removeItem('isLoggedIn'); localStorage.removeItem('currentUser'); window.location.href='index.html'; });

    renderPayments();
  })();
  </script>
